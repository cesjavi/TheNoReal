<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6A63D5">
        <animate attributeName="stop-color" values="#6A63D5;#2E2A78;#6A63D5" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F4B400">
        <animate attributeName="stop-color" values="#F4B400;#F7CF66;#F4B400" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)"/>
</svg>
