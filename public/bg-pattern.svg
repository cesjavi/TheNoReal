<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Fondo degradado -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9f9ff"/>
      <stop offset="100%" stop-color="#ececff"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#grad)"/>

  <!-- Ondas diagonales -->
  <path d="M-60 80 Q120 40 240 80 T540 80" stroke="#6A63D5" stroke-width="2" fill="none" opacity="0.08"/>
  <path d="M-60 160 Q120 120 240 160 T540 160" stroke="#6A63D5" stroke-width="2" fill="none" opacity="0.08"/>

  <!-- Estrellitas -->
  <g fill="#F4B400" opacity="0.8">
    <circle cx="60" cy="50" r="2"/>
    <circle cx="180" cy="70" r="2"/>
    <circle cx="100" cy="150" r="2"/>
    <circle cx="200" cy="190" r="2"/>
    <circle cx="40" cy="190" r="2"/>
  </g>

  <!-- Puntos violetas sutiles -->
  <g fill="#2E2A78" opacity="0.12">
    <circle cx="30" cy="30" r="1.5"/>
    <circle cx="210" cy="40" r="1.5"/>
    <circle cx="120" cy="200" r="1.5"/>
    <circle cx="60" cy="120" r="1.5"/>
  </g>
</svg>
