<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6A63D5" stop-opacity="0.6">
        <animate attributeName="stop-color" values="#6A63D5;#2E2A78;#6A63D5" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F4B400" stop-opacity="0.3">
        <animate attributeName="stop-color" values="#F4B400;#F7CF66;#F4B400" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#aurora)"/>
  <rect width="100%" height="100%" fill="url(#aurora)" transform="translate(0,50)">
    <animateTransform attributeName="transform" type="translate" from="0,50" to="0,-50" dur="12s" repeatCount="indefinite"/>
  </rect>
</svg>
